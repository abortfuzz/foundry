name: lazymio-docker

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lazymio-docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: lazymio
          password: ${{ secrets.DOCKER_HUB }}

      - name: Compute tags
        id: tags
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            GTAG="${GITHUB_REF#refs/tags/}"
            {
              echo "tags=lazymio/knowdit:foundry,lazymio/knowdit:foundry-${GTAG}"
              echo "tag_name=${GTAG}"
              echo "push=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags=lazymio/knowdit:foundry-build"
              echo "tag_name=build-${GITHUB_SHA::7}"
              echo "push=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build${{ startsWith(github.ref, 'refs/tags/') && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.lazymio
          push: ${{ steps.tags.outputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            TAG_NAME=${{ steps.tags.outputs.tag_name }}
            VERGEN_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
